apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodeaffinity-example
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nodeaffinity-example
  template:
    metadata:
      labels:
        app: nodeaffinity-example
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 1
            preference:
              matchExpressions:
              - key: "kubernetes.io/hostname"
                operator: In
                values:
                - "node-1"
      containers:
      - name: app-container
        image: nginx:latest