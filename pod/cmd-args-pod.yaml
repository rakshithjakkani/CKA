apiVersion: v1
kind: Pod
metadata:
  labels:
    run: command
  name: command
spec:
  containers:
  - image: busybox:latest
    name: command
    command: ["ping"]
    args: ["-c","60","google.com"]
  # - command:
  #   - ping
  #   - -c
  #   - "60"
  #   - google.com
  # we can define in both ways. any way is fine